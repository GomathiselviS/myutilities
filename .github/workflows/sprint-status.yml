name: Red Hat Jira Ultimate Sprint Dashboard

on:
  schedule:
    - cron: '0 21 * * 1' 
  workflow_dispatch: 

jobs:
  sprint-report:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and Analyze Jira Data
        id: jira_data
        run: |
          BOARD_ID="20622"
          BASE_URL="https://issues.redhat.com"
          TOKEN="${{ secrets.JIRA_API_TOKEN }}"
          
          # --- 1. CURRENT SPRINT DATA ---
          SPRINT_INFO=$(curl -s -f -H "Authorization: Bearer $TOKEN" "$BASE_URL/rest/agile/1.0/board/$BOARD_ID/sprint?state=active")
          SPRINT_ID=$(echo $SPRINT_INFO | jq -r '.values[0].id')
          SPRINT_NAME=$(echo $SPRINT_INFO | jq -r '.values[0].name')

          # Fetch all issues in sprint (for progress and status sections)
          ISSUES_JSON=$(curl -s -H "Authorization: Bearer $TOKEN" "$BASE_URL/rest/agile/1.0/sprint/$SPRINT_ID/issue?fields=status,summary,issuetype,issuelinks")
          
          # Done Percentage
          TOTAL=$(echo $ISSUES_JSON | jq '.total // 0')
          DONE_COUNT=$(echo $ISSUES_JSON | jq '[.issues[] | select(.fields.status.name == "Done" or .fields.status.name == "Closed" or .fields.status.name == "Release Pending")] | length')
          PERCENT=0
          if [ "$TOTAL" -gt 0 ]; then PERCENT=$(( 100 * DONE_COUNT / TOTAL )); fi

          # Separate Tickets: In Progress vs In Review
          IN_PROGRESS_TIX=$(echo $ISSUES_JSON | jq -r '.issues[] | select(.fields.issuetype.name != "Epic" and .fields.status.name == "In Progress") | "• \(.key): \(.fields.summary)"' | head -n 5 | paste -sd "\\n" -)
          IN_REVIEW_TIX=$(echo $ISSUES_JSON | jq -r '.issues[] | select(.fields.issuetype.name != "Epic" and .fields.status.name == "Review") | "• \(.key): \(.fields.summary)"' | head -n 5 | paste -sd "\\n" -)

          # Separate Epics: In Progress vs In Review (Filtered to only those in the current sprint)
          IP_EPICS=$(echo $ISSUES_JSON | jq -r '.issues[] | select(.fields.issuetype.name == "Epic" and .fields.status.name == "In Progress") | .fields.summary' | sort | uniq | paste -sd ", " -)
          REV_EPICS=$(echo $ISSUES_JSON | jq -r '.issues[] | select(.fields.issuetype.name == "Epic" and .fields.status.name == "Review") | .fields.summary' | sort | uniq | paste -sd ", " -)

          # Blocked Tickets (Flagged as Blocked OR has an active 'is blocked by' link)
          BLOCKED=$(echo $ISSUES_JSON | jq -r '.issues[] | select(.fields.status.name == "Blocked" or (.fields.issuelinks[]? | .type.inward == "is blocked by")) | "• \(.key): \(.fields.summary)"' | head -n 5 | paste -sd "\\n" -)

          # --- 2. LAST COMPLETED SPRINT ---
          # We sort by completeDate descending to ensure we get the absolute last finished sprint
          PAST_DATA=$(curl -s -H "Authorization: Bearer $TOKEN" "$BASE_URL/rest/agile/1.0/board/$BOARD_ID/sprint?state=closed&maxResults=1")
          PAST_JSON=$(echo $PAST_DATA | jq -r '.values | sort_by(.completeDate) | reverse | .[0]')
          PAST_NAME=$(echo $PAST_JSON | jq -r '.name // "N/A"')
          PAST_ID=$(echo $PAST_JSON | jq -r '.id // ""')
          
          PAST_TICKETS="None"
          if [ -n "$PAST_ID" ]; then
             PAST_TICKETS=$(curl -s -H "Authorization: Bearer $TOKEN" "$BASE_URL/rest/api/2/search?jql=sprint=$PAST_ID AND status in (Done, Closed, 'Release Pending') AND issuetype != Epic" | jq -r '.issues[] | "• \(.key): \(.fields.summary)"' | head -n 10 | paste -sd "\\n" -)
          fi

          # --- EXPORT ---
          {
            echo "curr_name=$SPRINT_NAME"
            echo "curr_percent=$PERCENT"
            echo "curr_stats=$DONE_COUNT / $TOTAL completed"
            echo "ip_tix<<EOF"
            echo "${IN_PROGRESS_TIX:-None}"
            echo "EOF"
            echo "rev_tix<<EOF"
            echo "${IN_REVIEW_TIX:-None}"
            echo "EOF"
            echo "blocked_tix<<EOF"
            echo "${BLOCKED:-None}"
            echo "EOF"
            echo "ip_epics=${IP_EPICS:-None}"
            echo "rev_epics=${REV_EPICS:-None}"
            echo "past_name=$PAST_NAME"
            echo "past_tix<<EOF"
            echo "${PAST_TICKETS:-None}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post to Slack
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          C_NAME: ${{ steps.jira_data.outputs.curr_name }}
          C_PERC: ${{ steps.jira_data.outputs.curr_percent }}
          C_STAT: ${{ steps.jira_data.outputs.curr_stats }}
          IP_T: ${{ steps.jira_data.outputs.ip_tix }}
          RV_T: ${{ steps.jira_data.outputs.rev_tix }}
          BK_T: ${{ steps.jira_data.outputs.blocked_tix }}
          IP_E: ${{ steps.jira_data.outputs.ip_epics }}
          RV_E: ${{ steps.jira_data.outputs.rev_epics }}
          P_NAME: ${{ steps.jira_data.outputs.past_name }}
          P_TIX: ${{ steps.jira_data.outputs.past_tix }}
        run: |
          PAYLOAD=$(jq -n \
            --arg cname "$C_NAME" --arg cperc "$C_PERC" --arg cstat "$C_STAT" \
            --arg ipt "$IP_T" --arg rvt "$RV_T" --arg bkt "$BK_T" \
            --arg ipe "$IP_E" --arg rve "$RV_E" \
            --arg pname "$P_NAME" --arg ptix "$P_TIX" \
            '{
              text: "Engineering Sprint Report",
              blocks: [
                {type: "header", text: {type: "plain_text", text: "🚀 Red Hat Jira Sprint Dashboard"}},
                {type: "section", text: {type: "mrkdwn", text: "*Sprint:* \($cname) | *Progress:* \($cperc)% (\($cstat))"}},
                {type: "divider"},
                {type: "section", fields: [
                  {type: "mrkdwn", text: "*🏃 In Progress Epics:*\n`\($ipe)`"},
                  {type: "mrkdwn", text: "*🔍 In Review Epics:*\n`\($rve)`"}
                ]},
                {type: "section", text: {type: "mrkdwn", text: "*🛠 Tickets In Progress:*\n\($ipt)"}},
                {type: "section", text: {type: "mrkdwn", text: "*🧪 Tickets In Review:*\n\($rvt)"}},
                {type: "section", text: {type: "mrkdwn", text: "*🛑 Blocked:*\n\($bkt)"}},
                {type: "divider"},
                {type: "section", text: {type: "mrkdwn", text: "*⏮ Last Sprint Recap (\($pname))*\n\($ptix)"}},
                {type: "context", elements: [{type: "mrkdwn", text: "Data from issues.redhat.com | Statuses: Done, Closed, Release Pending"}]}
              ]
            }')
          curl -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK"
